[project]
name = "readproof"
version = "0.1.0"
description = "An access-aware harness and benchmark for agentic search over social media: typed walls, official-player reading, channel-located evidence and verified quotes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Loong Nian Chew" }, { name = "LinkDigest" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
browser = ["playwright>=1.48"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
readproof = "readproof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["readproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs the network (deselected by default)"]
addopts = "-m 'not live'"
